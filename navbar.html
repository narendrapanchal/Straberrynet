<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preload" href="./CSS/header.css" as="style">

<title>Beauty Store - Skincare & Cosmetics</title>

<body>
<div id="header"></div>
<div id="navbaroptions" class="bg"></div>
<div id="middledata"></div>

<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script type="module">
import {headerupper,navbarbelow} from './Components/headertop.js';
const header=document.getElementById("header");
header.innerHTML=headerupper();
const navbaroptions=document.getElementById("navbaroptions");
navbaroptions.innerHTML=navbarbelow();

<script src="./Components/productCategories.js"></script>
<script>
// Register service worker for caching and performance
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(registration => console.log('SW registered:', registration))
      .catch(error => console.log('SW registration failed:', error));
  });
}
</script>
